[package]
name = "muse"
version = "0.1.0"
description = "Muse — local-first Metro music player"
edition = "2021"
rust-version = "1.90"

[lib]
name = "muse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
lofty = "0.22"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
walkdir = "2"
notify = "8"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
url = "2"
open = "5"
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication"] }
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
