<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muse — Modern Metro</title><style>
:root{font-family:Inter,"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;color:#f6f5f9;background:#101116;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #bca5ff;outline-offset:2px}.app{height: min(800px, 94vh);min-height:590px;display:flex;background:#111218;border:1px solid #2b2c35;border-radius:13px;overflow:hidden}.sidebar{width:206px;background:#171820;border-right:1px solid #2a2a35;padding:24px 12px;display:flex;flex-direction:column;gap:26px;flex-shrink:0}.brand{font-weight:800;font-size:27px;letter-spacing:-1.5px;padding-left:11px}.brand span{color:#bfa5ff}.nav{display:flex;flex-direction:column;gap:5px}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;color:#a6a5b2;text-align:left;padding:11px 12px;border-radius:7px;font-size:13px}.nav button:hover,.nav button.active{color:white;background:#282531}.nav button.active{box-shadow:inset 3px 0 #bba0fc}.nav svg{width:18px;height:18px;stroke-width:1.7}.sidebar-bottom{margin-top:auto;font-size:11px;color:#888896;padding:10px 11px;line-height:1.9}.sidebar-bottom button{margin-top:10px;background:#292630;color:#ddd5f0;border:1px solid #51465f;border-radius:6px;padding:10px;width:100%;font-size:12px}.main-area{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:66px;flex-shrink:0;padding:0 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #252630;gap:12px}.breadcrumb{color:#9594a4;font-size:12px}.tools{display:flex;align-items:center;gap:12px}.search{background:#22232b;border:1px solid #30303a;color:white;border-radius:6px;padding:9px 12px;width:220px;outline:none;font-size:12px}.search:focus{border-color:#a88bdc}.topbtn{border:1px solid #59506c;background:#362e48;color:#d9c8ff;font-size:12px;border-radius:6px;padding:10px 13px}.content{padding:26px 30px;overflow:auto;flex:1}.eyebrow{font-size:11px;letter-spacing:1.5px;color:#b7a1e4;text-transform:uppercase;font-weight:700}.heading{font-size:clamp(27px,3vw,43px);font-weight:750;letter-spacing:-1.5px;margin:7px 0 5px;line-height:1.15}.sub{color:#9695a5;font-size:13px;margin-bottom:23px}.section-title{font-size:17px;letter-spacing:-.4px;font-weight:650;margin:26px 0 13px}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;grid-auto-flow:dense}.tile{border:none;text-align:left;aspect-ratio:1/1;position:relative;overflow:hidden;background:#2b2a36;color:white;transition:transform .17s,filter .17s;border-radius:3px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}.tile:hover{transform:translateY(-2px);filter:brightness(1.13)}.tile.big{grid-column:span 2;grid-row:span 2}.tile.wide{grid-column:span 2;aspect-ratio:2/1}.tile.art{padding:0}.artwork{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative;color:#eee7f0}.artwork:after{content:'';position:absolute;inset:0;background:linear-gradient(165deg,transparent 30%,#07050866 100%)}.artwork .art-text{z-index:1;position:relative;font-weight:800;letter-spacing:-1px;font-size:clamp(14px,2vw,31px);line-height:.92;max-width:87%;overflow-wrap:anywhere}.artwork .art-sub{position:absolute;bottom:10%;z-index:1;font-size:9px;letter-spacing:2px;text-transform:uppercase;opacity:.8}.tile-caption{position:absolute;bottom:0;left:0;right:0;padding:18px 12px 10px;background:linear-gradient(transparent,#0009);z-index:3;font-size:12px;font-weight:650}.tile .symbol{font-size:30px;line-height:1}.tile .tile-label{font-size:12px;font-weight:670}.tile.purple{background:#695399}.tile.teal{background:#267985}.tile.rose{background:#a45579}.tile.amber{background:#ab793d}.tile.blue{background:#465b8e}.tile.lilac{background:#554876}.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:22px 15px}.albumcard{background:none;border:0;text-align:left;color:inherit;padding:0;min-width:0}.albumcard:hover .cover{transform:translateY(-3px)}.cover{aspect-ratio:1;width:100%;border-radius:4px;overflow:hidden;transition:transform .16s}.albumtitle{font-size:13px;font-weight:650;margin-top:9px;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}.albumartist{font-size:12px;color:#92919f;margin-top:3px;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px}.pill{padding:8px 13px;border:1px solid #363743;border-radius:4px;background:#22232b;color:#b9b8c5;font-size:12px}.pill.selected{background:#594a75;color:white;border-color:#8671b5}.detail{display:flex;gap:25px;align-items:end;margin:10px 0 23px}.detail-cover{height:194px;width:194px;flex:none;box-shadow:0 14px 35px #0007}.detail .heading{font-size:38px}.detail small{color:#bcbac8;font-size:12px}.primary{background:#b99df4;color:#1a1525;border:0;border-radius:5px;font-weight:700;padding:11px 17px;font-size:12px}.secondary{border:1px solid #47434e;background:#282630;color:#ddd5e6;padding:10px 14px;border-radius:5px;font-size:12px}.actions{display:flex;gap:8px;margin-top:17px;flex-wrap:wrap}.track-row{display:grid;grid-template-columns:25px minmax(0,1fr) minmax(70px,.5fr) 50px;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 9px;background:transparent;color:#edecf2;border:0;border-bottom:1px solid #2a2a34;font-size:12px}.track-row:hover,.track-row.playing{background:#262431}.track-row.playing{color:#c2aaff}.muted{color:#9694a5}.track-name{font-weight:600;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}.player{flex-shrink:0;border-top:1px solid #393542;background:#191920;padding:11px 24px 8px}.player-main{display:flex;align-items:center;gap:12px}.thumb{width:44px;height:44px;flex-shrink:0;border-radius:2px;overflow:hidden}.track-meta{width:29%;min-width:100px}.track-meta .name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-meta .artist{font-size:11px;color:#a7a4b5;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;align-items:center;justify-content:center;gap:10px;flex:1}.iconbtn{border:none;background:transparent;color:#cecbd5;font-size:19px;padding:6px}.iconbtn:hover{color:white}.playbtn{background:#c2a7fa;color:#1c1724;border:none;width:35px;height:35px;font-size:16px;border-radius:5px}.time{font-size:11px;color:#aaa8b6;font-variant-numeric:tabular-nums}.progress{width:100%;height:4px;accent-color:#bd9ef7;cursor:pointer;display:block;margin:10px 0 1px}.player-side{display:flex;align-items:center;gap:8px;width:25%;justify-content:flex-end}.volume{width:68px;accent-color:#bea2f6}.now{display:grid;grid-template-columns:minmax(150px,1fr) 1.1fr;gap:35px;align-items:center;max-width:780px;margin:12px auto}.nowcover{aspect-ratio:1;width:100%;max-width:380px;box-shadow:0 20px 45px #0008}.now h1{font-size:clamp(30px,4vw,50px);margin:12px 0 5px;letter-spacing:-2px}.now p{color:#aaa4ba}.now .huge{font-size:18px;margin-top:25px}.empty{border:1px dashed #4a4554;color:#aaa4b8;padding:45px 22px;text-align:center;border-radius:6px}.notice{font-size:12px;color:#d5c2fb;background:#30283b;border:1px solid #594671;padding:11px 14px;border-radius:5px;margin-bottom:15px}.responsive-toggle{display:none}@media(max-width:750px){.sidebar{width:64px;padding:19px 7px}.brand{font-size:16px;padding:0;text-align:center}.nav button{justify-content:center;padding:12px 4px}.nav button span,.sidebar-bottom{display:none}.topbar{padding:0 14px}.content{padding:21px 16px}.search{width:140px}.tiles{gap:6px}.tile{padding:8px}.tile .symbol{font-size:20px}.tile .tile-label{font-size:10px}.detail{align-items:start}.detail-cover{width:130px;height:130px}.detail .heading{font-size:26px}.track-row{grid-template-columns:20px minmax(0,1fr) 45px}.track-row .extra{display:none}.player{padding:10px 12px 7px}.player-side{display:none}.track-meta{width:36%}.now{grid-template-columns:1fr;gap:17px;justify-items:center;text-align:center}.nowcover{max-width:280px}}@media(max-width:460px){.search{width:100px}.topbtn{padding:9px;font-size:11px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile.big{grid-row:span 2}.albums{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{flex-direction:column}.player .time{display:none}}
</style></head><body><div id="app"></div><input id="filePicker" type="file" accept="audio/*,.mp3,.flac,.m4a,.wav,.ogg,.aac" multiple hidden><audio id="audio"></audio><script>
const icons={home:'⌂',library:'▦',songs:'♫',albums:'▣',playlists:'☷',now:'◉',folder:'↥',shuffle:'⤨',heart:'♡',clock:'◷',more:'···'};
const demoAlbums=[{id:'paper-lanterns',title:'paper lanterns',artist:'The Quiet Hours',year:2020,colors:['#857f79','#333333'],label:'paper lanterns',songs:['first light','harbour road','the long way home','kite string','small hours','north wind']},{id:'neon',title:'NEON GARDEN',artist:'Mira Vale',year:2021,colors:['#aaa0cc','#61518e'],label:'NEON GARDEN',songs:['static','glasshouse','late bus','echo park','satellite']},{id:'tides',title:'The Tides Between',artist:'Juniper Lane',year:2024,colors:['#c7baa6','#665649'],label:'THE TIDES BETWEEN',songs:['Saltwater','Lighthouse','Driftwood Letters','Come Back Slowly']},{id:'ember',title:'Ember',artist:'Oren Hale',year:2021,colors:['#7e4d45','#251e22'],label:'EMBER',songs:['Slow Burn','Hearth','Ash and Ivory','Morning After']},{id:'velvet',title:'velvet hour',artist:'Sol Ardent',year:2024,colors:['#a95150','#481b28'],label:'velvet hour',songs:['overture','afterglow','red balloon','city in the rain']},{id:'meadow',title:'meadowlark',artist:'The Quiet Hours',year:2020,colors:['#a57c55','#382725'],label:'meadowlark',songs:['wildflower','paper boats','golden field','winter coat']}];
const sample=demoAlbums.flatMap(a=>a.songs.map((name,i)=>({id:a.id+'-'+i,title:name,artist:a.artist,album:a.title,albumId:a.id,duration:0,local:false,liked:false})));
let state={page:'home',albumId:null,filter:'all',query:'',tracks:[...sample],selected:sample[0],playing:false,repeat:false,shuffle:false,queue:[],currentIndex:0,liked:new Set(),notice:'',volume:.8};
const audio=document.getElementById('audio');audio.volume=.8;
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function art(a){const x=a||{label:'♪',colors:['#4f3c77','#201a33']};return `<div class="artwork" style="background:linear-gradient(145deg,${x.colors[0]},${x.colors[1]})"><div class="art-text">${escapeHtml(x.label)}</div><div class="art-sub">${escapeHtml(x.artist||'muse')}</div></div>`}
function albumFor(t){return demoAlbums.find(a=>a.id===t?.albumId)||{id:'imports',title:t?.album||'Local Files',artist:t?.artist||'Unknown Artist',colors:['#6e5a91','#292638'],label:'♫'}}
function currentAlbums(){const imported=state.tracks.filter(t=>t.local);const groups=new Map();imported.forEach(t=>{const k=t.album+' | '+t.artist;if(!groups.has(k))groups.set(k,{id:'local:'+k,title:t.album,artist:t.artist,colors:['#6e5a91','#292638'],label:t.album,year:'Local',songs:[]});groups.get(k).songs.push(t.title)});return [...groups.values(),...demoAlbums]}
function listForAlbum(id){if(id.startsWith('local:')){const a=currentAlbums().find(a=>a.id===id);return state.tracks.filter(t=>t.local&&t.album===a.title&&t.artist===a.artist)}return state.tracks.filter(t=>t.albumId===id)}
function displayDuration(sec){if(!Number.isFinite(sec)||sec<=0)return '—';return `${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,'0')}`}
function navTo(page,id){state.page=page;state.albumId=id||null;state.query='';render()}
function setNotice(msg){state.notice=msg;render();}
function chooseTrack(id,autoplay=true){const track=state.tracks.find(t=>t.id===id);if(!track)return;state.selected=track;state.currentIndex=state.tracks.indexOf(track);if(!track.local){audio.pause();audio.removeAttribute('src');state.playing=false;state.notice='This is a design sample. Import local audio files to hear music.';render();return;}state.notice='';audio.src=track.url;audio.load();if(autoplay){audio.play().then(()=>{state.playing=true;render()}).catch(()=>{state.playing=false;render()})}else{state.playing=false;render()}}
function togglePlay(){if(!state.selected){return}if(!state.selected.local){setNotice('Import an audio file to enable playback. The sample collection is for previewing the design.');return}if(state.playing)audio.pause();else audio.play().catch(()=>setNotice('Your browser could not play this audio format.'));state.playing=!state.playing;render()}
function skip(dir){const playable=state.tracks.filter(t=>t.local);if(!playable.length){setNotice('Import local audio files to use the playback controls.');return}const idx=playable.findIndex(t=>t.id===state.selected?.id);const next=state.shuffle?Math.floor(Math.random()*playable.length):(idx+dir+playable.length)%playable.length;chooseTrack(playable[next].id)}
function importFiles(files){let added=0;for(const f of files){if(!(/\.(mp3|m4a|flac|wav|aac|ogg|opus|webm)$/i.test(f.name)||f.type.startsWith('audio/')))continue;const title=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ');const track={id:'file-'+Date.now()+'-'+added,title,artist:'Unknown Artist',album:'Local Imports',albumId:'imports',duration:0,local:true,url:URL.createObjectURL(f),liked:false};state.tracks.unshift(track);added++}state.page='library';state.filter='local';state.query='';state.notice=added?`Imported ${added} file${added!==1?'s':''}. These files remain available in this tab until you reload.`:'No supported audio files were selected.';render()}
function albumCard(a){return `<button class="albumcard" data-action="album" data-id="${escapeHtml(a.id)}"><div class="cover">${art(a)}</div><div class="albumtitle">${escapeHtml(a.title)}</div><div class="albumartist">${escapeHtml(a.artist)}</div></button>`}
function trackRow(t,i){return `<button class="track-row ${state.selected?.id===t.id?'playing':''}" data-action="track" data-id="${escapeHtml(t.id)}"><span class="muted">${i+1}</span><span class="track-name">${escapeHtml(t.title)} ${t.local?'':'<span class="muted" style="font-size:10px"> · demo</span>'}</span><span class="muted extra">${escapeHtml(t.artist)}</span><span class="muted" style="text-align:right">${displayDuration(t.duration)}</span></button>`}
function home(){const A=demoAlbums;return `<div class="eyebrow">YOUR PERSONAL MUSIC SPACE</div><h1 class="heading">Good afternoon.</h1><div class="sub">Everything you love, all in one place.</div><div class="tiles"><button class="tile big art" data-action="album" data-id="paper-lanterns">${art(A[0])}<div class="tile-caption">paper lanterns · The Quiet Hours</div></button><button class="tile purple" data-action="favorites"><span class="symbol">♡</span><span class="tile-label">favourites</span></button><button class="tile art" data-action="album" data-id="neon">${art(A[1])}</button><button class="tile teal" data-action="shuffle"><span class="symbol">⤨</span><span class="tile-label">shuffle all</span></button><button class="tile rose" data-action="nav" data-page="playlists"><span class="symbol">☷</span><span class="tile-label">playlists</span></button><button class="tile art" data-action="album" data-id="tides">${art(A[2])}</button><button class="tile amber" data-action="nav" data-page="library"><span class="symbol">◷</span><span class="tile-label">recently added</span></button><button class="tile wide lilac" data-action="nav" data-page="library"><span class="symbol">▦</span><span class="tile-label" style="font-size:17px">your collection <span style="display:block;font-weight:400;font-size:11px;opacity:.7;margin-top:4px">Albums · Artists · Songs</span></span></button></div><h2 class="section-title">Made for your library</h2><div class="albums">${currentAlbums().slice(0,5).map(albumCard).join('')}</div>`}
function library(){let albums=currentAlbums();const q=state.query.toLowerCase().trim();if(q)albums=albums.filter(a=>(a.title+' '+a.artist+' '+a.songs.join(' ')).toLowerCase().includes(q));if(state.filter==='local')albums=albums.filter(a=>a.id.startsWith('local:'));if(state.filter==='demo')albums=albums.filter(a=>!a.id.startsWith('local:'));return `<div class="eyebrow">ALL THE MUSIC YOU LOVE</div><h1 class="heading">Your library.</h1><div class="sub">${state.tracks.filter(t=>t.local).length} local songs · ${demoAlbums.length} example albums</div><div class="pills">${[['all','All music'],['local','My files'],['demo','Demo albums']].map(([v,l])=>`<button class="pill ${state.filter===v?'selected':''}" data-action="filter" data-value="${v}">${l}</button>`).join('')}</div>${albums.length?`<div class="albums">${albums.map(albumCard).join('')}</div>`:`<div class="empty">No albums match your selection.<br><br>Use “Import music” to add your own tracks.</div>`}`}
function detail(){const a=currentAlbums().find(a=>a.id===state.albumId);if(!a)return library();const songs=listForAlbum(a.id);return `<button class="secondary" data-action="nav" data-page="library">← Back to library</button><div class="detail"><div class="detail-cover">${art(a)}</div><div><div class="eyebrow">ALBUM · ${escapeHtml(a.year)}</div><h1 class="heading">${escapeHtml(a.title)}</h1><small>${escapeHtml(a.artist)} · ${songs.length} tracks</small><div class="actions"><button class="primary" data-action="play-album" data-id="${escapeHtml(a.id)}">▶ Play album</button><button class="secondary" data-action="shuffle-album" data-id="${escapeHtml(a.id)}">⤨ Shuffle</button></div></div></div>${songs.map(trackRow).join('')}`}
function songsPage(){let ts=state.tracks.filter(t=>!state.query||(t.title+' '+t.artist+' '+t.album).toLowerCase().includes(state.query.toLowerCase()));return `<div class="eyebrow">YOUR COLLECTION</div><h1 class="heading">All songs.</h1><div class="sub">${ts.length} tracks · Click to select or play</div>${ts.map(trackRow).join('')}`}
function favorites(){const ts=state.tracks.filter(t=>state.liked.has(t.id));return `<div class="eyebrow">YOUR OWN MIX</div><h1 class="heading">Favourites.</h1><div class="sub">The songs you've saved</div>${ts.length?ts.map(trackRow).join(''):`<div class="empty">No favourites yet. Tap the heart next to a song in Now Playing.</div>`}`}
function now(){const t=state.selected,a=albumFor(t);return `<div class="eyebrow">NOW PLAYING</div><div class="now"><div class="nowcover">${art(a)}</div><div><div class="eyebrow">${t?.local?'FROM YOUR LIBRARY':'DEMO TRACK'}</div><h1>${escapeHtml(t?.title||'Nothing selected')}</h1><p>${escapeHtml(t?.artist||'Import something to play')}</p><p style="font-size:12px">${escapeHtml(t?.album||'')}</p><div class="actions"><button class="primary huge" data-action="toggle">${state.playing?'Ⅱ Pause':'▶ Play'}</button><button class="secondary" data-action="like">${state.liked.has(t?.id)?'♥ Liked':'♡ Favourite'}</button><button class="secondary" data-action="repeat">${state.repeat?'↻ Repeat on':'↻ Repeat off'}</button></div><div class="sub" style="margin-top:25px">${t?.local?'Playing from an imported local file.':'Demo songs have no attached audio. Import your music to listen.'}</div></div></div>`}
function playlistPage(){return `<div class="eyebrow">YOUR COLLECTION</div><h1 class="heading">Playlists.</h1><div class="sub">Collections for every mood.</div><div class="tiles"><button class="tile purple" data-action="favorites"><span class="symbol">♥</span><span class="tile-label">Favourites<br><small>${state.liked.size} tracks</small></span></button><button class="tile teal" data-action="nav" data-page="library"><span class="symbol">↥</span><span class="tile-label">Local imports<br><small>${state.tracks.filter(t=>t.local).length} tracks</small></span></button></div><div class="sub" style="margin-top:24px">Custom playlists and drag-and-drop editing are planned for the full desktop version.</div>`}
function player(){const t=state.selected,a=albumFor(t);return `<div class="player"><div class="player-main"><div class="thumb">${art(a)}</div><div class="track-meta" role="button" data-action="nav" data-page="now" style="cursor:pointer"><div class="name">${escapeHtml(t?.title||'No track selected')}</div><div class="artist">${escapeHtml(t?.artist||'Your music awaits')}</div></div><div class="controls"><button class="iconbtn" data-action="shuffle" title="Shuffle">⤨</button><button class="iconbtn" data-action="prev" title="Previous">⏮</button><button class="playbtn" data-action="toggle" title="Play / pause">${state.playing?'Ⅱ':'▶'}</button><button class="iconbtn" data-action="next" title="Next">⏭</button><button class="iconbtn" data-action="repeat" title="Repeat" style="color:${state.repeat?'#c2a7fa':'#cecbd5'}">↻</button></div><div class="player-side"><span class="time" id="duration">${displayDuration(audio.duration)}</span><span class="iconbtn">◖</span><input class="volume" type="range" min="0" max="1" step="0.01" value="${state.volume}" aria-label="Volume" id="volume"></div></div><input class="progress" type="range" min="0" max="1000" value="${audio.duration?Math.floor(audio.currentTime/audio.duration*1000):0}" id="seek" aria-label="Playback position"></div>`}
function render(){const labels={home:'Home',library:'Library',songs:'Songs',playlists:'Playlists',favorites:'Favourites',now:'Now Playing',album:'Album'};const navs=[['home','Home','⌂'],['library','Library','▦'],['songs','Songs','♫'],['playlists','Playlists','☷'],['now','Now Playing','◉']];document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand">muse<span>.</span></div><div class="nav">${navs.map(([p,n,i])=>`<button class="${state.page===p?'active':''}" data-action="nav" data-page="${p}"><span style="display:inline;font-size:20px;min-width:18px">${i}</span><span>${n}</span></button>`).join('')}</div><div class="sidebar-bottom">LOCAL-FIRST PLAYER<br>No streaming. No subscriptions.<button data-action="import">↥ Import your music</button></div></aside><div class="main-area"><div class="topbar"><span class="breadcrumb">MY MUSIC / ${labels[state.page]||'Home'}</span><div class="tools"><input class="search" id="search" type="search" placeholder="Search music..." value="${escapeHtml(state.query)}" aria-label="Search music"><button class="topbtn" data-action="import">＋ Import music</button></div></div><div class="content" id="scrollable">${state.notice?`<div class="notice" id="notice">${escapeHtml(state.notice)} <button data-action="dismiss" style="float:right;background:none;border:0;color:inherit">✕</button></div>`:''}${state.page==='home'?home():state.page==='library'?library():state.page==='album'?detail():state.page==='songs'?songsPage():state.page==='favorites'?favorites():state.page==='now'?now():playlistPage()}</div>${player()}</div></div>`;document.getElementById('volume')?.addEventListener('input',e=>{audio.volume=+e.target.value;state.volume=+e.target.value});document.getElementById('seek')?.addEventListener('input',e=>{if(audio.duration&&state.selected?.local)audio.currentTime=+e.target.value/1000*audio.duration});const search=document.getElementById('search');search?.addEventListener('input',e=>{const pos=e.target.selectionStart;state.query=e.target.value;if(!['library','songs'].includes(state.page))state.page='library';const sc=document.getElementById('scrollable');const scroll=sc.scrollTop;render();document.getElementById('scrollable').scrollTop=scroll;const next=document.getElementById('search');next.focus();next.setSelectionRange(pos,pos)});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const {action,id,page,value}=b.dataset;switch(action){case'nav':navTo(page);break;case'album':navTo('album',id);break;case'track':chooseTrack(id);break;case'import':document.getElementById('filePicker').click();break;case'filter':state.filter=value;render();break;case'play-album':case'shuffle-album':{const ts=listForAlbum(id);const t=action==='shuffle-album'?ts[Math.floor(Math.random()*ts.length)]:ts[0];if(t)chooseTrack(t.id);break;}case'toggle':togglePlay();break;case'next':skip(1);break;case'prev':skip(-1);break;case'shuffle':{state.shuffle=!state.shuffle;skip(1);break}case'repeat':state.repeat=!state.repeat;render();break;case'favorites':navTo('favorites');break;case'like':if(state.selected){if(state.liked.has(state.selected.id))state.liked.delete(state.selected.id);else state.liked.add(state.selected.id)}render();break;case'dismiss':state.notice='';render();break}});
document.getElementById('filePicker').addEventListener('change',e=>{importFiles(Array.from(e.target.files));e.target.value=''});audio.addEventListener('ended',()=>{if(state.repeat){audio.currentTime=0;audio.play()}else skip(1)});audio.addEventListener('loadedmetadata',()=>{if(state.selected?.local)state.selected.duration=audio.duration;updatePlayback()});audio.addEventListener('timeupdate',updatePlayback);audio.addEventListener('play',()=>{state.playing=true;updatePlayback()});audio.addEventListener('pause',()=>{state.playing=false;updatePlayback()});function updatePlayback(){const seek=document.getElementById('seek'),d=document.getElementById('duration');if(seek)seek.value=audio.duration?audio.currentTime/audio.duration*1000:0;if(d)d.textContent=displayDuration(audio.duration);const play=document.querySelector('.playbtn');if(play)play.textContent=state.playing?'Ⅱ':'▶'}document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement?.tagName)){e.preventDefault();togglePlay()}});render();
</script></body></html>
